<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.06); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -120; }
      }
      @keyframes orbitRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes beaconPing {
        0% { r: 5; opacity: 1; }
        100% { r: 24; opacity: 0; }
      }

      .pulse-ambient { animation: pulseGlow 7s ease-in-out infinite; transform-origin: center; }
      .float-card-1 { animation: floatSlow1 6s ease-in-out infinite; }
      .float-card-2 { animation: floatSlow2 7.5s ease-in-out infinite; }
      .flow-pulse { stroke-dasharray: 6 12; animation: dashMove 3s linear infinite; }
      .flow-pulse-fast { stroke-dasharray: 8 14; animation: dashMove 2s linear infinite; }
      .beacon-ring { animation: beaconPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .beacon-ring-delay { animation: beaconPing 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; animation-delay: 1.25s; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.4px;
      }
      .mono-text {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      }
    </style>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Tech Grid Overlay (Background) -->
  <g opacity="0.12">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#38bdf8" stroke-width="1" />

    <line x1="150" y1="0" x2="150" y2="420" stroke="#818cf8" stroke-width="1" />
    <line x1="350" y1="0" x2="350" y2="420" stroke="#818cf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="420" stroke="#818cf8" stroke-width="1" />
    <line x1="850" y1="0" x2="850" y2="420" stroke="#818cf8" stroke-width="1" />
    <line x1="1050" y1="0" x2="1050" y2="420" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs (Behind Content) -->
  <circle cx="200" cy="90" r="140" fill="url(#glowCyan)" filter="url(#neonBlur)" class="pulse-ambient" />
  <circle cx="1020" cy="310" r="170" fill="url(#glowPurple)" filter="url(#neonBlur)" class="pulse-ambient" style="animation-delay: -3.5s;" />
  <circle cx="600" cy="200" r="100" fill="#6366f1" opacity="0.15" filter="url(#neonBlur)" />

  <!-- Dynamic Multi-Agent Synapse Paths (Background Network Flow) -->
  <g opacity="0.45">
    <!-- Connecting curves between agent hubs -->
    <path d="M 120 320 C 260 220, 380 340, 520 250 S 760 140, 940 220 S 1080 320, 1140 180" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-pulse" />
    <path d="M 80 180 C 240 110, 420 180, 600 130 S 880 90, 1120 120" 
          fill="none" stroke="#a855f7" stroke-width="2" class="flow-pulse-fast" />
    <path d="M 220 380 Q 560 270 980 370" 
          fill="none" stroke="#ec4899" stroke-width="1.8" class="flow-pulse" style="animation-duration: 4.5s;" />

    <!-- Pulse nodes on network -->
    <circle cx="120" cy="320" r="6" fill="#38bdf8" />
    <circle cx="120" cy="320" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon-ring" />
    
    <circle cx="520" cy="250" r="5" fill="#818cf8" />
    
    <circle cx="940" cy="220" r="6" fill="#c084fc" />
    <circle cx="940" cy="220" r="12" fill="none" stroke="#c084fc" stroke-width="1.5" class="beacon-ring-delay" />

    <circle cx="1120" cy="120" r="5" fill="#38bdf8" />
  </g>

  <!-- Interactive / Dynamic Side Card 1: Orchestration Node (Right Top) -->
  <g class="float-card-1" opacity="0.85">
    <rect x="910" y="45" width="230" height="92" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleBlur)" />
    <circle cx="936" cy="73" r="8" fill="#10b981" />
    <circle cx="936" cy="73" r="14" fill="none" stroke="#10b981" stroke-width="1.5" class="beacon-ring" />
    <text x="956" y="78" fill="#f8fafc" class="badge-text" font-size="13">Multi-Agent Swarm</text>
    <text x="936" y="112" fill="#94a3b8" class="mono-text" font-size="11">Status: Active [LangGraph+CrewAI]</text>
  </g>

  <!-- Interactive / Dynamic Side Card 2: Workflow Pipeline Node (Left Bottom) -->
  <g class="float-card-2" opacity="0.85">
    <rect x="60" y="270" width="220" height="92" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" filter="url(#subtleBlur)" />
    <circle cx="86" cy="298" r="8" fill="#ec4899" />
    <circle cx="86" cy="298" r="14" fill="none" stroke="#ec4899" stroke-width="1.5" class="beacon-ring-delay" />
    <text x="106" y="303" fill="#f8fafc" class="badge-text" font-size="13">Autonomous Runtime</text>
    <text x="86" y="337" fill="#94a3b8" class="mono-text" font-size="11">DAG Tasks: Executing 100%</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Subtitle, Capability Tags -->
  <!-- Guaranteed Foreground & High Contrast -->
  <g>
    <!-- Top Pill Badges -->
    <g transform="translate(600, 78)">
      <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" opacity="0.95" />
      <circle cx="-212" cy="0" r="5" fill="#38bdf8" />
      <text x="0" y="5" fill="#e2e8f0" text-anchor="middle" class="badge-text">
        ⚡ AWESOME CURATED DIRECTORY &amp; BENCHMARKS ⚡
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="152" text-anchor="middle" fill="url(#titleGrad)" class="title-text" font-size="44" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Multi-Agent Systems &amp; Workflow Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" text-anchor="middle" fill="#cbd5e1" class="title-text" font-weight="400" font-size="19" letter-spacing="0.2px">
      Comprehensive Guide to Open-Source Frameworks &amp; Enterprise SaaS Agent Platforms
    </text>

    <!-- Detailed Secondary Caption -->
    <text x="600" y="226" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      Stateful Graphs • Autonomous Swarms • Tool Use • Multi-LLM Routing • Visual Pipelines
    </text>

    <!-- Tech Stack Feature Pills Row -->
    <g transform="translate(600, 280)">
      <!-- Pill 1: LangGraph & LangChain -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95" />
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="badge-text" font-size="12">LangGraph</text>
      </g>

      <!-- Pill 2: CrewAI -->
      <g transform="translate(-160, 0)">
        <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" opacity="0.95" />
        <text x="0" y="5" text-anchor="middle" fill="#fda4af" class="badge-text" font-size="12">CrewAI</text>
      </g>

      <!-- Pill 3: Microsoft AutoGen -->
      <g transform="translate(0, 0)">
        <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.95" />
        <text x="0" y="5" text-anchor="middle" fill="#d8b4fe" class="badge-text" font-size="12">AutoGen</text>
      </g>

      <!-- Pill 4: Dify AI -->
      <g transform="translate(150, 0)">
        <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.95" />
        <text x="0" y="5" text-anchor="middle" fill="#6ee7b7" class="badge-text" font-size="12">Dify.ai</text>
      </g>

      <!-- Pill 5: Flowise -->
      <g transform="translate(290, 0)">
        <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#1e293b" stroke="#eab308" stroke-width="1.5" opacity="0.95" />
        <text x="0" y="5" text-anchor="middle" fill="#fde047" class="badge-text" font-size="12">Flowise</text>
      </g>
    </g>

    <!-- Bottom Metrics Highlights Banner Bar -->
    <g transform="translate(600, 360)">
      <rect x="-420" y="-20" width="840" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9" />
      <text x="-290" y="5" text-anchor="middle" fill="#cbd5e1" class="mono-text" font-size="13">
        🌟 <tspan fill="#f1f5f9" font-weight="bold">1,000,000+</tspan> Total OSS Stars
      </text>
      <line x1="-150" y1="-10" x2="-150" y2="10" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#cbd5e1" class="mono-text" font-size="13">
        📊 <tspan fill="#f1f5f9" font-weight="bold">$35B+</tspan> Orchestration Market by 2030
      </text>
      <line x1="150" y1="-10" x2="150" y2="10" stroke="#334155" stroke-width="1" />
      <text x="290" y="5" text-anchor="middle" fill="#cbd5e1" class="mono-text" font-size="13">
        🤖 <tspan fill="#f1f5f9" font-weight="bold">Top 20+</tspan> Architectures &amp; SaaS
      </text>
    </g>
  </g>
</svg>
