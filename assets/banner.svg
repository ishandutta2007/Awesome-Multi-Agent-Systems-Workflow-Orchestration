igin:center}.float-card-1{animation:floatSlow1 6s ease-in-out infinite}.float-card-2{animation:floatSlow2 7.5s ease-in-out infinite}.flow-pulse{stroke-dasharray:6 12;animation:dashMove 3s linear infinite}.flow-pulse-fast{stroke-dasharray:8 14;animation:dashMove 2s linear infinite}.beacon-ring,.beacon-ring-delay{animation:beaconPing 2.5s cubic-bezier(0,.2,.8,1) infinite}.beacon-ring-delay{animation-delay:1.25s}.badge-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.badge-text{font-weight:600;font-size:13px;letter-spacing:.4px}.mono-text{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,Menlo,Courier,monospace}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g opacity=".12"><line x1="0" x2="1200" y1="70" y2="70" stroke="#38bdf8" stroke-width="1"/><line x1="0" x2="1200" y1="140" y2="140" stroke="#38bdf8" stroke-width="1"/><line x1="0" x2="1200" y1="210" y2="210" stroke="#38bdf8" stroke-width="1"/><line x1="0" x2="1200" y1="280" y2="280" stroke="#38bdf8" stroke-width="1"/><line x1="0" x2="1200" y1="350" y2="350" stroke="#38bdf8" stroke-width="1"/><line x1="150" x2="150" y1="0" y2="420" stroke="#818cf8" stroke-width="1"/><line x1="350" x2="350" y1="0" y2="420" stroke="#818cf8" stroke-width="1"/><line x1="600" x2="600" y1="0" y2="420" stroke="#818cf8" stroke-width="1"/><line x1="850" x2="850" y1="0" y2="420" stroke="#818cf8" stroke-width="1"/><line x1="1050" x2="1050" y1="0" y2="420" stroke="#818cf8" stroke-width="1"/></g><circle cx="200" cy="90" r="140" fill="url(#glowCyan)" class="pulse-ambient" filter="url(#neonBlur)"/><circle cx="1020" cy="310" r="170" fill="url(#glowPurple)" class="pulse-ambient" filter="url(#neonBlur)" style="animation-delay:-3.5s"/><circle cx="600" cy="200" r="100" fill="#6366f1" filter="url(#neonBlur)" opacity=".15"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-wid